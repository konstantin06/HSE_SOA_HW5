x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx384m

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.7.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx96m' kafka-topics --bootstrap-server localhost:9092 --list >/dev/null"]
    interval: 30s
    timeout: 15s
    retries: 8
    start_period: 30s

x-app: &app
  build: .
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8).read()"]
    interval: 15s
    timeout: 10s
    retries: 8
    start_period: 20s

services:
  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes: [kafka1-data:/var/lib/kafka/data]
  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes: [kafka2-data:/var/lib/kafka/data]
  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes: [kafka3-data:/var/lib/kafka/data]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    restart: unless-stopped
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports: ["127.0.0.1:${REGISTRY_PORT:-8081}:8081"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 6s
      retries: 12

  producer:
    <<: *app
    command: ["uvicorn", "app.producer:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      schema-registry: {condition: service_healthy}
    environment:
      GENERATOR_ENABLED: ${GENERATOR_ENABLED:-true}
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS:-3}
    volumes: [generator-data:/var/lib/movie-generator]
    ports: ["127.0.0.1:${MOVIE_PORT:-8000}:8000"]

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56
    restart: unless-stopped
    depends_on:
      schema-registry: {condition: service_healthy}
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema_demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./sql/clickhouse/001_tables.sql:/docker-entrypoint-initdb.d/001_tables.sql:ro
      - ./sql/clickhouse/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    ports: ["127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user cinema --password cinema_demo --query 'EXISTS TABLE cinema.daily_metrics' | grep -qx 1"]
      interval: 10s
      timeout: 6s
      retries: 15

  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_demo
      TZ: UTC
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=cinema_demo psql -h 127.0.0.1 -U cinema -d cinema -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: cinema
      MINIO_ROOT_PASSWORD: cinema_demo
    volumes: [s3-data:/data]
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 6s
      retries: 12

  aggregator:
    <<: *app
    command: ["uvicorn", "app.aggregator:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      AGG_INTERVAL_SECONDS: ${AGG_INTERVAL_SECONDS:-60}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    ports: ["127.0.0.1:${AGG_PORT:-8001}:8000"]

  grafana:
    build: ./grafana
    restart: unless-stopped
    depends_on:
      clickhouse: {condition: service_healthy}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cinema_demo
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cinema.json
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  tests:
    profiles: [test]
    build: .
    command: ["python", "-m", "unittest", "-v", "tests.test_logic", "tests.test_http", "tests.test_pipeline"]
    depends_on:
      producer: {condition: service_healthy}
      aggregator: {condition: service_healthy}
      minio: {condition: service_healthy}
      grafana: {condition: service_healthy}

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  generator-data:
  ch-data:
  pg-data:
  s3-data:
